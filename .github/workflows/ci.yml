name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit to check and deploy
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  deploy:
    needs: check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.ref != ''
    runs-on: ubuntu-latest
    # One deploy at a time, and only the commit that is still the head of main: an older run that
    # finishes late must not overwrite a newer deploy (the newer commit's own run deploys it).
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    steps:
      - id: latest
        name: Check this is still the head of main
        run: |
          head=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ "$head" = "${{ inputs.ref || github.sha }}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on to $head; that commit's own run deploys it."
          fi
      - if: steps.latest.outputs.deploy == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - if: steps.latest.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=wta-race --branch=main
